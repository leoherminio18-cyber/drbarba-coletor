name: gravador ao vivo

# Cada execução fica em loop ~5h40 (o GitHub encerra trabalhos com 6 h) e, no fim, dispara a
# próxima (o agendamento do GitHub disparava pouco; ver coletor.yml). O cron fica de reserva. O
# grupo de concorrência impede duas ao mesmo tempo.
on:
  schedule:
    - cron: '3 */2 * * *'
  workflow_dispatch:

concurrency:
  group: aovivo
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # disparar a próxima execução

jobs:
  aovivo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: gravar jogos ao vivo
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DADOS_TOKEN: ${{ secrets.DADOS_TOKEN }}
          DADOS_REPO: ${{ vars.DADOS_REPO }}
          DURACAO_MIN: '340'
        run: python ao_vivo.py

      - name: disparar a próxima execução
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ao_vivo.yml --repo "$GITHUB_REPOSITORY" --ref main
