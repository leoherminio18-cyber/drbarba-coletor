name: coletor de odds

on:
  schedule:
    # de 15 em 15 min, fora da virada da hora (o GitHub atrasa mais no :00)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      forcar_varredura:
        description: 'Forçar a varredura completa agora'
        type: boolean
        default: false

concurrency:
  group: coletor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para apagar caches velhos do estado

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: memória do coletor (última odd vista de cada jogo)
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: coletar
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DADOS_TOKEN: ${{ secrets.DADOS_TOKEN }}
          DADOS_REPO: ${{ vars.DADOS_REPO }}
          FORCAR_VARREDURA: ${{ inputs.forcar_varredura && '1' || '' }}
        run: python coletor.py

      - name: guardar a memória
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}

      - name: apagar memórias antigas (fica a mais recente e 2 de reserva)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key estado- --sort created_at --order desc --limit 100 --json id \
            --jq '.[3:][].id' | while read id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true; done
